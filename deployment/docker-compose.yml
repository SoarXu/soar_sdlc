name: ${COMPOSE_PROJECT_NAME:?Set the existing Compose project name in .env}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intellective_bio_sdlc}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deployment/backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?Release metadata missing}
        GIT_COMMIT: ${GIT_COMMIT:?Release metadata missing}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GIT_PLATFORM_ENCRYPTION_KEY: ${GIT_PLATFORM_ENCRYPTION_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-intellective_bio_sdlc}?charset=utf8mb4
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?Release metadata missing}
        GIT_COMMIT: ${GIT_COMMIT:?Release metadata missing}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
